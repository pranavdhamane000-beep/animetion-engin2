[package]
name = "anim_test_support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anim_core = { path = "../anim_core" }
# Added for `wp03_save`, spec 12.12's killed-process scenarios: 4.2 assigns fault
# injection to this crate, and a save that dies mid-write has to save something. Only
# workspace members and the already-locked `uuid` join the graph, so `Cargo.lock` gains
# dependency edges and no new crate. DECISIONS.md #31.
anim_assets = { path = "../anim_assets" }
anim_project = { path = "../anim_project" }
# Added for `wp04_snapshot`, spec 13.12's "identical canonical snapshots and event logs
# from two fresh processes". Same reasoning and same precedent as `anim_project` above:
# a claim about processes can only be proven by a process, 4.2 assigns that to this
# crate, and the crate the claim is about has to be linkable from here. The edge is
# downward through the chain spec 13.4 already draws (`anim_scene -> anim_project`), so
# no package that spec forbids becomes reachable.
anim_scene = { path = "../anim_scene" }
# Added for `wp05_replay` and `tests/wp05_isolation.rs`, spec 14.12's "run 10,000 frames in
# two fresh processes and compare all CPU state hashes". Same precedent as `anim_scene` above
# and for the same reason: a claim about processes can only be proven by a process, spec 4.2
# assigns process fault-injection to this crate, and the crate the claim is about has to be
# linkable from here. `anim_headless` is the second edge because 14.3 puts the reporting code
# in that crate (`src/replay.rs`), so the child calls it rather than restating it.
anim_sim = { path = "../anim_sim" }
anim_headless = { path = "../anim_headless" }
# Added for `src/gpu_memory.rs`, spec 16.12's synthetic-budget and fault-injection suite
# and 16.3's assignment of that file to this crate. Same precedent as the edges above:
# the crate the claim is about has to be linkable from here.
anim_render = { path = "../anim_render" }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# WP00 probe binaries. Declared here because cargo auto-discovers src/bin/*.rs and
# gives every binary this crate's dependency set; the probes are the only consumers.
anyhow = { workspace = true }
blake3 = { workspace = true }
bytemuck = { workspace = true }
hex = { workspace = true }
pollster = { workspace = true }
wgpu = { workspace = true }
ash = { workspace = true }
sha2 = { workspace = true }
symphonia = { workspace = true }
rubato = { workspace = true }
hound = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Target-gated: spec 5.1 requires the Win32 dependency stay behind a cfg so no
# cross-platform API leaks into the portable crates.
windows = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = ["dxgi-telemetry"]
# Forwarded so gpu_memory's adapter-mismatch scenario compiles out with the renderer's
# telemetry, matching anim_headless's forwarding.
dxgi-telemetry = ["anim_render/dxgi-telemetry"]

[lints]
workspace = true
